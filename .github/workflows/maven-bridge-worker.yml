name: Maven bridge worker

on:
  pull_request:
    paths:
      - "apps/maven-bridge-worker/**"
      - ".github/workflows/maven-bridge-worker.yml"
  push:
    branches: [main]
    paths:
      - "apps/maven-bridge-worker/**"
      - ".github/workflows/maven-bridge-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/maven-bridge-worker

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/maven-bridge-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (dry run)
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy to Cloudflare
    needs: test
    # deploys only from main (push or manual run), never from pull requests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: maven-bridge-worker-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_FLUSH_TOKEN: ${{ secrets.MAVEN_BRIDGE_FLUSH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/maven-bridge-worker/package-lock.json
      - run: npm ci
      - name: Create KV namespace and R2 bucket (idempotent)
        run: node scripts/provision.mjs
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/maven-bridge-worker
          command: deploy
      - name: Set FLUSH_TOKEN (only when the secret exists)
        if: env.HAS_FLUSH_TOKEN == 'true'
        env:
          FLUSH_TOKEN: ${{ secrets.MAVEN_BRIDGE_FLUSH_TOKEN }}
        run: printf '%s' "$FLUSH_TOKEN" | npx wrangler secret put FLUSH_TOKEN
