name: Extension provider worker

on:
  pull_request:
    paths:
      - "apps/extension-worker/**"
      - ".github/workflows/extension-worker.yml"
  push:
    branches: [main]
    paths:
      - "apps/extension-worker/**"
      - ".github/workflows/extension-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/extension-worker

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (dry run)
        run: npx wrangler deploy --dry-run --outdir dist
