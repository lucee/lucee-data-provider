# Lucee Maven bridge on Cloudflare Workers (port of apps/maven-bridge).
# Hostnames: maven.lucee-services.com (production) and mvn.lucee-services.com (test).
name = "lucee-maven-bridge"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "maven.lucee-services.com", custom_domain = true },
  { pattern = "mvn.lucee-services.com", custom_domain = true },
]

# landing page assets (/res/*)
[assets]
directory = "./public"

# hourly refresh of the provider indexes and upstream group files
[triggers]
crons = ["0 * * * *"]

# CPU limit per invocation (Workers Paid only; a deploy on the Free plan fails with it).
# Background checksum work (waitUntil) counts toward the same limit. Hashing a ~66 MB core jar
# takes a few hundred ms of CPU: well within the Paid default (30 s), over the Free limit (10 ms).
# [limits]
# cpu_ms = 60000

[observability]
enabled = true

# Provider indexes, upstream group files and the cache generation.
# The id is filled in by scripts/provision.mjs in CI (namespace "lucee-maven-bridge-cache").
[[kv_namespaces]]
binding = "BRIDGE_CACHE"

# Artifact bucket, only used when R2_MODE = "serve" (and on the hostnames in R2_HOSTS).
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "lucee-artifacts"

[vars]
EXTENSION_PROVIDERS = "https://www.forgebox.io|io.forgebox,https://extension.lucee.org|org.lucee|https://cdn.lucee.org/"
CACHE_TTL_MINUTES = "60"
# directory listings and maven-metadata.xml are cached per location for this long, so new releases show up quickly; 0 = not cached
METADATA_CACHE_TTL_MINUTES = "5"
TIMEOUT = "300"
GITHUB_RELEASES_URL = "https://github.com/lucee/Lucee/releases/download/"
# "off": upstream redirects only (like maven-bridge); "serve": serve objects found in R2 first
R2_MODE = "serve"
# "true": in serve mode, store artifacts in R2 on their first request (read-through cache, lazy migration);
# SNAPSHOT files are stored too and revalidated against their source after R2_REVALIDATE_MINUTES
R2_FILL_ON_MISS = "true"
R2_REVALIDATE_MINUTES = "5"
# hostnames that use R2 (R2_MODE, R2_FILL_ON_MISS); all others keep the upstream redirects. Empty = all hostnames.
R2_HOSTS = "mvn.lucee-services.com"
R2_FILL_STREAM_MAX_MB = "32"
R2_PREFIX = ""
# SNAPSHOT files are stored under this key prefix (after R2_PREFIX), so a lifecycle rule can expire them
R2_SNAPSHOT_PREFIX = "snapshots/"
# days after which stored SNAPSHOT files are deleted (lifecycle rule set by scripts/provision.mjs), 0 = keep forever
R2_SNAPSHOT_RETENTION_DAYS = "90"
# checksums missing upstream are computed from artifacts up to this size (MB), 0 = never
CHECKSUM_MAX_MB = "128"
# larger artifacts are hashed in the background (the checksum answers 404 until it is cached), 0 = always
CHECKSUM_INLINE_MAX_MB = "16"
# FLUSH_TOKEN is a secret: wrangler secret put FLUSH_TOKEN (flush is disabled without it)
